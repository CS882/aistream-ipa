plugins { id 'com.android.application' }

android {
    namespace 'com.aistream.pending.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.aistream.pending.tv'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release { minifyEnabled false }
    }

    // TV 版加载 tv.html?platform=tv，Leanback 声明见 AndroidManifest.xml
    sourceSets {
        main { assets.srcDirs = ['src/main/assets'] }
    }
}

// 零第三方依赖：DPAD 按键在 MainActivity 中显式注入 DOM 事件
dependencies { }
