# AIStream 影视 · 巨魔（TrollStore）IPA 云端构建
# ------------------------------------------------------------------
# 在 GitHub 托管 macOS runner 上编译 iOS 原生壳，用 ldid 伪签名，
# 产出可被巨魔直接安装的 IPA。全程不需要 Apple 开发者账号、不需要签名证书。
#
# 使用方法：
#   1) 把本项目推送到任意 GitHub 仓库（公开 / 私有均可）
#   2) 进入 Actions → "Build TrollStore IPA" → Run workflow
#   3) 运行结束后在本次运行的 Artifacts 下载 AIStream-TrollStore-IPA
#
# 可选参数（Run workflow 时可填）：
#   gateway     内置网关地址，默认 http://fnos.jiulingkeji.asia:8890
#   bundle_id   App 包名，默认 com.aistream.player
# ------------------------------------------------------------------
name: Build TrollStore IPA

on:
  workflow_dispatch:
    inputs:
      gateway:
        description: '内置内容源网关（需公网可达且带 CORS 的代理地址）'
        required: false
        default: 'http://fnos.jiulingkeji.asia:8890'
      bundle_id:
        description: 'App Bundle ID（巨魔无需注册，唯一即可）'
        required: false
        default: 'com.aistream.player'

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装 Capacitor 6 依赖
        run: |
          npm install --no-audit --no-fund
          npm install --no-audit --no-fund @capacitor/core@6 @capacitor/cli@6 @capacitor/ios@6

      - name: 注入构建参数（网关 / Bundle ID）
        env:
          GATEWAY_URL: ${{ github.event.inputs.gateway || 'http://fnos.jiulingkeji.asia:8890' }}
          IOS_BUNDLE_ID: ${{ github.event.inputs.bundle_id || 'com.aistream.player' }}
          IOS_TEAM_ID: 'AAAAAAAAAA'
        run: node scripts/prepare-trollstore-ipa.mjs

      - name: 同步四端 Web 资源
        run: npm run sync:assets

      - name: 生成 / 同步 Xcode 工程
        run: |
          # ios/ 目录已存在（存放构建脚本）；cap add 见到 ios/ 就拒绝。
          # 先把脚本暂存到项目外 → 删除 ios/ → 用 cap add 生成原生工程 → 拷回脚本。
          mkdir -p "$RUNNER_TEMP/aistream-ios-scripts"
          cp ios/*.sh ios/*.plist "$RUNNER_TEMP/aistream-ios-scripts/" 2>/dev/null || true
          rm -rf ios
          npx cap add ios
          cp "$RUNNER_TEMP/aistream-ios-scripts/"*.sh "$RUNNER_TEMP/aistream-ios-scripts/"*.plist ios/ 2>/dev/null || true
          npx cap sync ios

      - name: 配置 Info.plist（允许明文 HTTP 访问内网网关）
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST"

      - name: 安装 CocoaPods 依赖
        run: |
          cd ios/App
          pod install --repo-update

      - name: 安装 ldid（伪签名工具）
        run: brew install ldid

      - name: 构建未签名 App
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            build

      - name: 伪签名并打包 IPA
        run: bash ios/package-trollstore-ipa.sh

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: AIStream-TrollStore-IPA
          path: dist/ipa/*.ipa
          if-no-files-found: error
